# Render Blueprint Specification
# Free Tier Docker Web Service Deployment (includes GDAL / GEOS / PROJ C-dependencies)
services:
  - type: web
    name: bouldermove-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false

